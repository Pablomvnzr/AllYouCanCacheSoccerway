services:
  redis:
    image: redis:7-alpine
    command: >-
      redis-server --maxmemory ${CACHE_MAXMEMORY:-10mb}
      --maxmemory-policy ${CACHE_EVICTION_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scraper-service:
    build: ./scraper-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  metrics-service:
    build: ./metrics-service
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:9000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  cache-service:
    build: ./Sistemas_de_cache
    environment:
      REDIS_HOST: redis
      SCRAPER_URL: http://scraper-service:8000
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      SCRAPER_TIMEOUT_SECONDS: 120
      METRICS_URL: http://metrics-service:9000/events
    ports:
      - "5001:5000"
    depends_on:
      redis:
        condition: service_healthy
      scraper-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  traffic-generator:
    build: ./generador_trafico
    environment:
      CACHE_URL: http://cache-service:5000/api/consultas
      TRAFFIC_REQUEST_COUNT: ${TRAFFIC_REQUEST_COUNT:-20}
      TRAFFIC_ARRIVAL_SECONDS: ${TRAFFIC_ARRIVAL_SECONDS:-0.5}
      TRAFFIC_DISTRIBUTION: ${TRAFFIC_DISTRIBUTION:-zipf}
      TRAFFIC_ZIPF_ALPHA: ${TRAFFIC_ZIPF_ALPHA:-1.5}
    depends_on:
      cache-service:
        condition: service_healthy
